# set-option -g status-right "#[fg=red]🎯Target: #[fg=white]#(awk -F'=' '/^export IP=/ && !/^#/ {print $2}' ~/.ip) #[fg=brightblack]|#[fg=blue] 🌐VPN: #[fg=white]#(ip -4 addr show tun0 | awk '/inet / {print $2}' | cut -d/ -f1) #[fg=brightblack]|#[fg=yellow] 🕒%H:%M #[fg=brightblack]|#[fg=cyan] 💻#H"

# Inactive windows
set -g window-status-format "#[fg=brightblack][#[fg=white]#I:#W #[fg=brightblack]#F#[fg=brightblack]]"

# Active window
set -g window-status-current-format "#[fg=brightblack][#[fg=blue,bold]#I:#W #[fg=yellow]#F#[fg=black]]"


# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# quick source .tmux with C-a + :

setw -g mode-keys vi 

# Increasing the buffer size
set-option -g history-limit 4000

##############################################################
##### HTB logging (tmux 3.5a) #####

# Where logs go (session name becomes the machine name)
set -g @htb_log_root "$HOME/Documents/obsidian/docs/CTF/HTB"
set-environment -g HTB_LOG_ROOT "$HOME/Documents/obsidian/docs/CTF/HTB"

# Pipe-pane helper script (handles per-pane metadata + filenames)
set -g @htb_pipe_script "$HOME/.local/bin/htb-tmux-pipe-pane"

# When a pane is created (new window or split), start piping it
set-hook -g after-new-window  "run-shell -b '#{@htb_pipe_script} #{pane_id}'"
set-hook -g after-split-window "run-shell -b '#{@htb_pipe_script} #{pane_id}'"

# Also: when a session is created, pipe the panes that already exist (pane 0 in window 0)
# This makes sure logging starts even for the very first pane.
set-hook -g session-created 'run-shell -b "#{@htb_pipe_script} --session #{session_name}"'


##### Optional: convenience commands (manual control) #####

# Start logging current pane (if you ever need manual)
bind-key P run-shell -b '#{@htb_pipe_script} #{pane_id}'

# Stop logging current pane
bind-key p pipe-pane
