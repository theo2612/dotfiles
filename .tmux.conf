##############################################################
##### tmux-logging #####
##############################################################
#
# Logs every pane of a session to $TMUX_LOG_ROOT/<session>/
#   cmd.log  - commands you typed  (shell hook: ~/.config/tmux-logging/log.{zsh,bash})
#   out.log  - filtered pane output (tmux-log-start -> tmux-log-filter)
#
# OFF by default. Toggle for the machine with:  prefix C-l
# (on/off state is the flag file ~/.tmux-logging)
#
# Usage: tmux new -s <box-name>   ->  logs land in ~/LOGS/<box-name>/
#
##############################################################

set-environment -g TMUX_LOG_ROOT "$HOME/LOGS"
set -g @tmux_log_start "$HOME/.local/bin/tmux-log-start"

# Every new window/split/session asks tmux-log-start to pipe the pane.
# tmux-log-start exits immediately when logging is toggled off.
set-hook -g after-new-window   "run-shell -b '#{@tmux_log_start} #{pane_id}'"
set-hook -g after-split-window "run-shell -b '#{@tmux_log_start} #{pane_id}'"
set-hook -g session-created    'run-shell -b "#{@tmux_log_start} --session #{session_name}"'

bind C-l run-shell -b '$HOME/.local/bin/tmux-log-toggle #{pane_id}'

# Manual per-pane control (P still respects the on/off flag)
bind P run-shell -b '#{@tmux_log_start} #{pane_id}'
bind p pipe-pane

##############################################################
##### General #####
##############################################################
#
# Everything here uses -g (global), which is right for a single-user
# machine. On a SHARED client jumpbox use `set -t <session>` instead,
# or you reconfigure your teammates' sessions.
#
##############################################################

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g display-time 3000
set -g status-interval 5
set -sg escape-time 10

# Copy mode uses vi keys (mode-keys is a window option, hence setw)
setw -g mode-keys vi

# Splits that look like what they do (overrides default `prefix -` delete-buffer)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Alt-arrow switches panes without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# previous-window lives on B because `prefix p` is pipe-pane above
bind B previous-window

# Straight to tiled layout (terminals often swallow the default M-5)
bind T select-layout tiled

# Reload config (overrides default `prefix r` refresh-client)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##############################################################
##### Status bar #####
##############################################################

set -g status-style 'bg=colour236,fg=colour250'
set -g status-left  '#[bg=colour33,fg=white,bold] #S #[default] '
set -g status-left-length 30

set -g window-status-format         "#[fg=brightblack][#[fg=white]#I:#W #[fg=brightblack]#F]"
set -g window-status-current-format "#[fg=brightblack][#[fg=blue,bold]#I:#W #[fg=yellow]#F#[fg=brightblack]]"

# Target/VPN only appear when ~/.ip or tun0 exist (see tmux-status-target).
# LOG ON/OFF shows whether the ACTIVE pane is currently being piped to out.log.
set -g status-right '#(~/.local/bin/tmux-status-target)#{?pane_pipe,#[bg=green] LOG ON #[default],#[bg=red] LOG OFF #[default]} %-m/%-d %H:%M '
set -g status-right-length 80
